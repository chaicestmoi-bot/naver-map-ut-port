<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>함께 고르기 · 네이버지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#111214;--sheet:#1C1D1F;--card:#26272A;--card2:#2E3033;--line:#2C2E31;--bd:#45474B;
--tx:#fff;--sub:#A0A3A8;--mute:#6E7176;--blue:#3182F6;--bt:#6EA8FF;--navy:#07245A;--nbd:#2A5CAA;
--green:#1DBF4E;--red:#F04452;--m:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--tx);
-webkit-font-smoothing:antialiased;letter-spacing:-.2px;display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;letter-spacing:inherit}
input{font:inherit;color:inherit;background:none;border:none;outline:none;letter-spacing:inherit}
img{display:block}
#dev{position:relative;width:390px;height:844px;background:var(--bg);overflow:hidden;border-radius:44px;
box-shadow:0 0 0 10px #1a1a1a,0 30px 80px rgba(0,0,0,.6)}
.sb{height:47px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px 34px;
font-size:16px;font-weight:600;position:relative;z-index:30}
@media (max-width:500px){body{display:block}#dev{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
.sb{height:env(safe-area-inset-top,0px);padding:0;overflow:hidden;visibility:hidden}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}
.hs{display:flex;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory}
.row{display:flex;align-items:center}.btw{display:flex;align-items:center;justify-content:space-between}
.f1{flex:1;min-width:0}.fn{flex:none}
.px{padding-left:var(--m);padding-right:var(--m)}
.t26{font-size:26px;font-weight:700;letter-spacing:-.6px}.t22{font-size:22px;font-weight:700;letter-spacing:-.5px}
.t20{font-size:20px;font-weight:700;letter-spacing:-.4px}.t18{font-size:18px;font-weight:700;letter-spacing:-.4px}
.t16{font-size:16px}.t15{font-size:15px}.t14{font-size:14px}.t13{font-size:13px}.t12{font-size:12px}
.b{font-weight:700}.s6{font-weight:600}.sub{color:var(--sub)}.mute{color:var(--mute)}.bt{color:var(--bt)}
.ib{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ib.g{background:var(--card2)}
.btn{height:52px;border-radius:14px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;width:100%;
display:flex;align-items:center;justify-content:center;gap:6px}
.btn.gray{background:var(--card2);color:var(--mute)}.btn.dark{background:var(--card2);color:#fff}
.btn.sm{height:44px;font-size:15px;border-radius:12px}
.btn.navy{background:#1B5FD0}
.pill{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--bd);font-size:15px;display:inline-flex;
align-items:center;gap:4px;flex:none;white-space:nowrap}
.pill.on{background:#12305F;border-color:#12305F;color:var(--bt);font-weight:600}
.pill.w{background:#fff;border-color:#fff;color:#111;font-weight:700}
.op{flex:1;height:48px;border-radius:24px;background:var(--card2);border:1.5px solid var(--card2);font-size:16px;font-weight:600}
.op.like{background:#10284F;border-color:var(--blue);color:var(--bt)}
.op.dis{background:#3A3B3F;border-color:#8A8D92}
.adj{display:block;margin:14px auto 0;font-size:15px;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
.adj.on{color:#F5B74E}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid #6E7176;display:flex;align-items:center;justify-content:center;flex:none}
.chk.on{background:var(--blue);border-color:var(--blue)}
.cbox{width:22px;height:22px;border-radius:5px;border:2px solid #8A8D92;display:flex;align-items:center;justify-content:center;flex:none}
.cbox.on{background:var(--blue);border-color:var(--blue)}
.tog{width:52px;height:32px;border-radius:16px;background:#4A4C50;position:relative;flex:none;transition:.2s}
.tog i{position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--blue)}.tog.on i{left:23px}
.av{border-radius:50%;object-fit:cover;flex:none;background:#333}
.avs{display:flex}.avs img{margin-left:-8px;border:2px solid var(--sheet)}.avs img:first-child{margin-left:0}
.lic{width:52px;height:52px;border-radius:50%;position:relative;flex:none;display:flex;align-items:center;justify-content:center}
.lic .bd{position:absolute;right:-3px;bottom:-3px;width:22px;height:22px;border-radius:50%;background:#1C1D1F;
border:2px solid #1C1D1F;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border-radius:20px}
.navyc{background:var(--navy);border:1.5px solid var(--nbd);border-radius:20px}
.hr{height:1px;background:var(--line)}
.tabbar{flex:none;background:#131416;border-top:1px solid #232427;display:flex;padding:8px 8px 0}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#8A8D92;padding-bottom:6px}
.tabbar button.on{color:#fff;font-weight:600}
.homei{flex:none;height:26px;display:flex;justify-content:center;align-items:center;background:#131416}
.homei i{width:134px;height:5px;border-radius:3px;background:#fff}
@media (max-width:500px){.homei{height:max(8px,env(safe-area-inset-bottom))}.homei i{display:none}}
.ov{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fd .2s}
.sheet{position:relative;background:var(--sheet);border-radius:24px 24px 0 0;max-height:94%;display:flex;flex-direction:column;
animation:up .28s cubic-bezier(.2,.9,.3,1)}
.hdl{width:40px;height:5px;border-radius:3px;background:#4A4C50;margin:10px auto 6px;flex:none}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}@keyframes fd{from{opacity:0}to{opacity:1}}
.toast{position:absolute;left:var(--m);right:var(--m);bottom:118px;z-index:80;background:#fff;color:#111;border-radius:16px;
padding:16px 18px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:up2 .25s}
.toast button{margin-left:auto;color:#fff;background:var(--blue);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;flex:none}
@keyframes up2{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.notice{position:absolute;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:0 32px}
.notice .bx{position:relative;background:#2A2B2E;border-radius:20px;padding:26px 22px 18px;width:100%;text-align:center;animation:fd .2s}
.map{position:relative;overflow:hidden;background:#202225}
.map .r{position:absolute;background:#2C2F33}
.dots{display:flex;justify-content:center;gap:5px;margin-top:10px}.dots i{width:6px;height:6px;border-radius:3px;background:#4A4C50}
.dots i.on{width:18px;background:#fff}
.field{height:52px;border-radius:14px;background:var(--card);display:flex;align-items:center;gap:10px;padding:0 16px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:4px}
.seg button{flex:1;height:40px;border-radius:9px;font-size:16px;font-weight:600;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:#44474B;color:#fff}
.dim2{opacity:.4}
</style>
</head>

<div class="row" style="gap:10px;margin-top:10px">${[['transit', '대중교통', 'bus'], ['car', '자차', 'car']].map(([k, t, ic]) => `<button data-a="oMode" data-v="${k}" class="pill" style="height:48px;padding:0 18px;font-size:16px;${S.oMode === k ? 'background:#0E2750;border-color:var(--blue);color:var(--bt);font-weight:700' : 'background:var(--card2);border-color:var(--card2);color:var(--sub)'}">${I[ic]({ s: 18 })}${t}</button>`).join('')}</div>
<div class="row t13 sub" style="gap:6px;margin-top:16px">${I.lock({ s: 14 })}정확한 출발지는 나만 볼 수 있어요. 다른 사람에게는 이동시간만 보여요.</div>
<button class="btn" data-a="saveOrigin" style="margin-top:28px">입력하기</button>
<button data-a="closeSheet" class="t15 sub" style="display:block;margin:14px auto 24px;text-decoration:underline;text-underline-offset:3px">나중에 하기</button></div>`);
}
function shReason() {
  return sheetWrap(`<div class="hdl"></div><div class="px" style="padding-top:12px">
<div class="t18">조율이 필요한 이유가 무엇인가요</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px">${REASONS.map(([e, t]) => { const on = S.rdraft.includes(t);
  return `<button data-a="reasonToggle" data-v="${t}" style="height:48px;border-radius:24px;font-size:15px;font-weight:600;${on ? 'background:#0E2750;border:1.5px solid var(--blue);color:#fff' : 'background:var(--card2);border:1.5px solid #3A3C40;color:#D6D9DD'}">${e} ${t}</button>`; }).join('')}</div>
<button data-a="reasonOther" class="t15" style="display:block;margin:16px auto 0;text-decoration:underline;text-underline-offset:3px;color:${S.rother ? '#F5B74E' : 'var(--sub)'}">기타 이유가 있어요</button>
${S.rother ? `<div class="field" style="margin-top:12px"><input data-i="rotherText" class="f1 t15" placeholder="이유를 짧게 적어주세요"></div>` : ''}
<button class="btn ${S.rdraft.length || S.rother ? '' : 'gray'}" data-a="saveReason" style="margin:22px 0 26px">저장</button></div>`);
}
function shConfirm() {
  const p = P[S.sp];
  return sheetWrap(`<div class="hdl"></div><div class="px" style="padding-top:14px"><div class="t22">${p.name}${/[가-힣]$/.test(p.name) && ((p.name.charCodeAt(p.name.length - 1) - 44032) % 28) ? '으로' : '로'} 확정할까요?</div>
<div class="t15 sub" style="margin-top:12px;line-height:1.6">확정하면 참여자에게 알림이 가고,<br>나머지 후보는 흐리게 표시돼요. 나중에 바꿀 수 있어요.</div>
<button class="btn" data-a="doConfirm" style="margin-top:26px">확정하기</button>
<button data-a="closeSheet" class="t15 sub" style="display:block;margin:14px auto 26px;text-decoration:underline;text-underline-offset:3px">다시 생각해볼래요</button></div>`);
}
/* ---------- 이동 ---------- */
function go(sc) { if (S.screen !== sc) S.stack.push(S.screen); S.screen = sc; S.sheet = null; }
function back() {
  S.sheet = null;
  const prev = S.stack.pop();
  S.screen = prev || (isHost() ? 'discover' : 'board');
  if (S.screen === 'compare') S.screen = 'board';
}
let tTimer = null;
function toast(text, label, act) {
  S.toast = { text, label, act }; clearTimeout(tTimer);
  tTimer = setTimeout(() => { S.toast = null; render(); }, label ? 5200 : 3200);
}
function notice(text) { S.notice = text; }
function afterShareClose() { if (S.pendingToast) { const t = S.pendingToast; S.pendingToast = null; toast(t[0], t[1], t[2]); } }
function friendsArrive() {
  if (!isHost() || S.resp || S.arriving) return;
  S.arriving = true;
  setTimeout(() => { S.resp = true; S.arriving = false; S.seen = false;
    toast('친구 3명이 의견을 남겼어요', '결과 보기', 'viewResults'); render(); }, 3000);
}

const A = {
  pickRole: v => { S.rolePick = v; },
  startRole: () => {
    if (!S.rolePick) return;
    const r = S.rolePick; const keep = S._frame; S = fresh(); S.role = r; S.rolePick = r;
    if (r === 'host') { S.screen = 'discover'; }
    else { S.list = { name: '9월 모임', color: '#3182F6', together: true, ai: true, places: ['hokun', 'gojip', 'sherwood'], shared: true, confirmed: null }; S.screen = 'invite'; }
  },
  toRole: () => { S = fresh(); },
  tab: v => {
    if (v === 'find') { S.stack = []; S.screen = 'discover'; S.sheet = null; }
    else if (v === 'saved') { S.stack = []; S.screen = 'saved'; S.sheet = null; }
    else notice('이번 테스트에서는<br>쓰지 않는 메뉴예요');
  },
  back: () => back(),
  toSaved: () => { S.stack = []; S.screen = 'saved'; },
  goSearch: () => { S.q = ''; go('search'); S._focus = true; },
  setQ: v => { S.q = v; },
  aiChip: v => { S.q = v; go('search'); },
  pickResult: v => {
    S.dPlace = v; S.dSheet = true; S.q = '';
    if (S.stack[S.stack.length - 1] === 'discover') S.stack.pop();
    S.screen = 'discover';
  },
  closeDSheet: () => { S.dSheet = false; },
  openDetail: v => { S.detail = v; go('detail'); },
  openSave: v => { S.sp = v; S.sheet = 'save'; },
  saveToggle: v => {
    const sel = S.saveSel[S.sp] || (S.saveSel[S.sp] = {});
    const inList = S.list && S.list.places.includes(S.sp);
    if (v === 'new') { const cur = sel.new !== undefined ? sel.new : inList; sel.new = !cur; if (sel.new === inList) delete sel.new; }
    else { sel[v] = !sel[v]; if (!sel[v]) delete sel[v]; }
  },
  toggleExConf: () => { S.exConf = !S.exConf; },
  saveApply: () => {
    const sel = S.saveSel[S.sp] || {}; if (!Object.keys(sel).length) return;
    let msg = ['저장했어요'];
    if (sel.new !== undefined && S.list) {
      if (sel.new) { if (!S.list.places.includes(S.sp)) S.list.places.push(S.sp); msg = [`'${S.list.name}'에 추가했어요`, '리스트 보기', 'openBoard']; if (S.list.shared) friendsArrive(); }
      else { S.list.places = S.list.places.filter(x => x !== S.sp); msg = [`'${S.list.name}'에서 뺐어요`]; }
      delete sel.new;
    }
    S.sheet = null; toast(msg[0], msg[1], msg[2]);
  },
  newList: () => { S.nFromSave = false; S.nn = ''; S.nt = false; S.nai = false; S.nsc = 'private'; S.sheet = 'new'; },
  newListFromSave: () => { S.nFromSave = true; S.nn = ''; S.nt = false; S.nai = false; S.nsc = 'private'; S.sheet = 'new'; },
  color: v => { S.nc = +v; },
  togTogether: () => { S.nt = !S.nt; if (S.nt) { S.nai = false; if (S.nsc === 'public') S.nsc = 'private'; } else { S.nai = false; } },
  togAi: () => { S.nai = !S.nai; },
  scope: v => { S.nsc = v; },
  createList: () => {
    const name = S.nn.trim(); if (!name) return;
    S.list = { name, color: COLORS[S.nc], together: S.nt, ai: S.nt && S.nai, places: S.nFromSave ? [S.sp] : [], shared: false, confirmed: null };
    if (S.nFromSave) S.saveSel[S.sp] = {};
    const t = S.nFromSave ? [`'${name}'에 추가했어요`, '리스트 보기', 'openBoard'] : [`'${name}' 리스트를 만들었어요`, '리스트 보기', 'openBoard'];
    if (S.nt) { S.pendingToast = t; S.sheet = 'share'; } else { S.sheet = null; toast(t[0], t[1], t[2]); }
  },
  closeSheet: () => { const was = S.sheet; S.sheet = null; if (was === 'share') afterShareClose(); },
  share: () => { if (S.list) S.sheet = 'share'; },
  doShare: v => {
    if (!S.list) { S.sheet = null; return; }
    S.list.shared = true; S.sheet = null;
    const t = S.pendingToast; S.pendingToast = null;
    toast(v === '링크 복사' ? '링크를 복사했어요' : `${v}(으)로 공유했어요`);
    if (t) setTimeout(() => { toast(t[0], t[1], t[2]); render(); }, 1300);
    if (S.list.places.length) friendsArrive();
  },
  menu: () => { S.sheet = 'menu'; },
  openBoard: () => { if (!S.list) return; S.tab = 'places'; S.compare = false; go('board'); },
  viewResults: () => { if (S.screen !== 'board') go('board'); S.tab = 'results'; S.seen = true; },
  toastOther: () => notice('이번 테스트에서는<br><b style="color:#8FBBFF">9월 모임</b>만 열어볼 수 있어요'),
  closeNotice: () => { S.notice = null; },
  hideAi: () => { S.aiBanner = false; },
  hideOBanner: () => { S.oBannerHidden = true; },
  clearName: () => { S.nn = ''; },
  goAi: () => { go('ai'); },
  setTab: v => { S.tab = v; if (v === 'results') S.seen = true; if (v === 'results') S.compare = false; },
  toggleCompare: () => { S.compare = !S.compare; S.csel = []; S.tab = 'places'; },
  csel: v => { const i = S.csel.indexOf(v); if (i >= 0) S.csel.splice(i, 1); else S.csel.push(v); },
  startCompare: () => { if (S.csel.length < 2) return; S.compare = false; go('compare'); },
  cmpFromDetail: () => { S.csel = listPlaces().slice(); go('compare'); },
  filter: v => { S.filter = S.filter === v ? null : v; },
  hideAlert: () => { S.alert = false; },
  opLike: v => { S.op[v] = S.op[v] === 'like' ? undefined : 'like'; if (!S.op[v]) delete S.op[v]; S.rs[v] = []; },
  opDis: v => { if (S.op[v] === 'dislike') { delete S.op[v]; } else { S.op[v] = 'dislike'; S.rs[v] = []; toast('별로예요로 남겼어요'); } },
  opAdj: v => { S.sp = v; S.rdraft = (S.rs[v] || []).slice(); S.rother = false; S.sheet = 'reason'; },
  reasonToggle: v => { const i = S.rdraft.indexOf(v); if (i >= 0) S.rdraft.splice(i, 1); else S.rdraft.push(v); },
  reasonOther: () => { S.rother = !S.rother; },
  saveReason: () => {
    if (!S.rdraft.length && !S.rother) return;
    const extra = S.rother && S.rotherText ? [S.rotherText] : (S.rother ? ['기타'] : []);
    S.op[S.sp] = 'adjust'; S.rs[S.sp] = S.rdraft.concat(extra); S.sheet = null; S.rotherText = '';
  },
  askConfirm: v => { S.sp = v; S.sheet = 'confirm'; },
  doConfirm: () => { S.list.confirmed = S.sp; S.sheet = null; S.tab = 'results'; toast('참여자에게 알림을 보냈어요'); },
  askAdjust: () => toast('조율 요청을 보냈어요'),
  toastBook: () => toast('네이버 예약으로 이동해요'),
  toastEdit: () => { S.sheet = null; notice('이번 테스트에서는<br>쓰지 않는 메뉴예요'); },
  toastMembers: () => { S.sheet = null; notice('이번 테스트에서는<br>쓰지 않는 메뉴예요'); },
  toastDelete: () => { S.sheet = null; notice('이번 테스트에서는<br>쓰지 않는 메뉴예요'); },
  openOrigin: () => { S.sheet = 'origin'; },
  oPreset: v => { S.oAddr = v; },
  oMode: v => { S.oMode = v; },
  saveOrigin: () => { if (!isHost()) S.origin = { addr: S.oAddr, mode: S.oMode }; S.sheet = null; toast(isHost() ? '출발지를 수정했어요' : '출발지를 알려줬어요'); },
  acceptInvite: () => { S.stack = ['invite']; S.screen = 'board'; S.tab = 'places'; S.sheet = 'origin'; }
};

/* ---------- 렌더 ---------- */
const app = document.getElementById('app');
const SCR = { role: scrRole, saved: scrSaved, discover: scrDiscover, search: scrSearch, invite: scrInvite, board: scrBoard, detail: scrDetail, compare: scrCompare, ai: scrAi };
const SH = { save: shSave, new: shNewList, share: shShare, menu: shMenu, origin: shOrigin, reason: shReason, confirm: shConfirm };
function render() {
  app.querySelectorAll('[data-sk]').forEach(el => { S._sc[el.dataset.sk] = el.scrollTop; });
  const t = S.toast ? `<div class="toast">${S.toast.text}${S.toast.label ? `<button data-a="${S.toast.act}">${S.toast.label}</button>` : ''}</div>` : '';
  const nt = S.notice ? `<div class="notice"><div class="dim" data-a="closeNotice"></div><div class="bx">
<div class="ib" style="width:48px;height:48px;background:#12305F;margin:0 auto">${I.info({ s: 26, c: '#8FBBFF' })}</div>
<div class="t18" style="margin-top:14px;line-height:1.45">${S.notice}</div>
<button class="btn" data-a="closeNotice" style="margin-top:20px">확인</button></div></div>` : '';
  app.innerHTML = (SCR[S.screen] || scrRole)() + (S.sheet ? SH[S.sheet]() : '') + t + nt;
  app.querySelectorAll('[data-sk]').forEach(el => { if (S._sc[el.dataset.sk]) el.scrollTop = S._sc[el.dataset.sk]; });
  const bar = document.getElementById('cmpbar'), tb = app.querySelector('.tabbar'), hi = app.querySelector('.homei');
  if (bar && tb) bar.style.bottom = (tb.offsetHeight + (hi ? hi.offsetHeight : 0)) + 'px';
  if (S._focus) { const q = document.getElementById('q'); if (q) { q.focus({ preventScroll: true }); } S._focus = false; }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  e.preventDefault(); fn(el.dataset.v, el); render();
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.i; if (!k) return;
  S[k] = e.target.value;
  if (k === 'q') { const r = document.getElementById('qres'); if (r) r.innerHTML = searchResults(); }
  if (k === 'nn') { const c = document.getElementById('nmc'), b = document.getElementById('nmSave');
    if (c) c.innerHTML = '<b style="color:#fff">' + S.nn.length + '</b> / 20'; if (b) b.className = 'btn ' + (S.nn.trim() ? '' : 'gray');
    const x = document.getElementById('nmx'); if (x) x.style.display = S.nn ? 'flex' : 'none'; }
});
document.addEventListener('scroll', e => {
  const t = e.target; if (!t || !t.classList || !t.classList.contains('hs')) return;
  const first = t.firstElementChild; if (!first) return;
  const w = first.getBoundingClientRect().width + 10;
  const i = Math.round(t.scrollLeft / w);
  if (t.dataset.dots) { const d = t.nextElementSibling; if (d && d.classList.contains('dots')) [...d.children].forEach((x, k) => x.classList.toggle('on', k === Math.min(i, d.children.length - 1))); }
  if (t.id === 'cmpTrack') { const n = t.children.length, k = Math.min(Math.round(t.scrollLeft / (first.getBoundingClientRect().width + 12)), n - 1);
    const idx = document.getElementById('cmpIdx'); if (idx) idx.textContent = k + 1;
    const d = document.getElementById('cmpDots'); if (d) [...d.children].forEach((x, j) => x.classList.toggle('on', j === k)); }
}, true);
render();
</script>
</body>
</html>
